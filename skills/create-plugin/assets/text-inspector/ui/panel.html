<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文本格式检查</title>
  <style>
    :root { color-scheme: light; --bg:#fff; --fg:#202124; --muted:#62666c; --line:#dedfe2; --control:#f5f5f6; --focus:#3265bf; --danger:#b42318; --danger-hover:#fff1f0; }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#18191b; --fg:#ececef; --muted:#b0b3b9; --line:#3c3e43; --control:#25272b; --focus:#8bb3fb; --danger:#f6aaa4; --danger-hover:#392323; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,sans-serif; }
    h1 { margin:0 0 4px; font-size:16px; font-weight:600; }
    p { margin:0 0 12px; }
    .muted { color:var(--muted); }
    #findings { margin:0 0 16px; padding:0; list-style:none; max-height:190px; overflow:auto; border-block:1px solid var(--line); }
    #findings label { display:flex; align-items:center; gap:8px; min-height:38px; padding:6px 0; cursor:pointer; }
    input { accent-color:var(--focus); }
    button { display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:7px 12px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--fg); font:inherit; font-weight:500; cursor:pointer; transition:background-color 150ms,color 150ms,border-color 150ms; }
    button:hover:not(:disabled) { background:var(--control); }
    button:active:not(:disabled) { border-color:var(--muted); }
    button:disabled { color:var(--muted); background:var(--control); border-color:var(--line); cursor:not-allowed; }
    .primary { min-height:40px; border-color:var(--fg); background:var(--fg); color:var(--bg); padding-inline:16px; font-weight:600; }
    .primary:hover:not(:disabled) { background:color-mix(in srgb,var(--fg) 85%,var(--bg)); }
    .danger { color:var(--danger); background:transparent; border-color:transparent; }
    .danger:hover:not(:disabled) { color:var(--danger); background:var(--danger-hover); border-color:transparent; }
    :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
    .actions { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
    #selection-count { font-size:12px; }
    #preview { width:100%; min-height:120px; max-height:250px; resize:vertical; padding:10px; border:1px solid var(--line); border-radius:5px; color:var(--fg); background:var(--bg); font:13px/1.5 ui-monospace,monospace; tab-size:2; }
    .preview-label { display:block; margin-bottom:6px; }
    #status { min-height:21px; margin-bottom:8px; }
    footer { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }
    .finish { display:flex; flex-direction:column; align-items:flex-end; gap:2px; margin-left:auto; }
    #finish-hint { font-size:12px; }
    ::selection { background:var(--fg); color:var(--bg); }
    @media (prefers-reduced-motion:reduce) { button { transition:none; } }
    @media (max-width:360px) { body { padding:12px; } .actions button { flex:1 1 auto; } }
  </style>
</head>
<body>
  <h1>文本格式检查</h1>
  <p class="muted">勾选要修复的问题，确认后生成文本预览。不会修改文件。</p>
  <ul id="findings" aria-label="可选格式问题"></ul>
  <div class="actions"><button id="preview-button" class="primary" disabled>生成修复预览</button><span id="selection-count" class="muted">请选择要修复的问题</span></div>
  <p id="status" role="status" aria-live="polite">正在加载检查结果…</p>
  <label class="preview-label" for="preview">当前文本（可选中复制）</label>
  <textarea id="preview" readonly spellcheck="false" aria-describedby="status"></textarea>
  <footer><button id="sidebar">在侧栏查看</button><div class="finish"><button id="dismiss" class="danger" aria-describedby="finish-hint">结束此交互</button><span id="finish-hint" class="muted">结束后仅供查看</span></div></footer>

;(() => {
const { createPluginUiClient } = VykorPluginUi;

const list = document.querySelector("#findings");
const preview = document.querySelector("#preview");
const button = document.querySelector("#preview-button");
const status = document.querySelector("#status");
const sidebar = document.querySelector("#sidebar");
const dismiss = document.querySelector("#dismiss");
const selectionCount = document.querySelector("#selection-count");
const selected = new Set();
let snapshot;
let pending = false;
let revision;
const errors = {
  plugin_ui_user_cancelled: "已取消，没有执行修复。",
  plugin_ui_revision_conflict: "结果已更新，请重新选择问题。",
  plugin_ui_session_busy: "会话正在执行其他操作，请稍后再试。",
  plugin_ui_read_only: "当前结果只能查看，不能执行操作。",
  plugin_ui_mount_closed: "交互已关闭，可从结果卡重新打开。",
  plugin_ui_request_timeout: "请求超时，请先查看最新结果，再决定是否重试。",

  const locked = pending || snapshot?.readOnly || !!snapshot?.activeAction;
  button.disabled = locked || selected.size === 0;
  selectionCount.textContent = selected.size ? "已选 " + selected.size + " 项" : "请选择要修复的问题";
  for (const input of list.querySelectorAll("input")) input.disabled = !!locked;
  sidebar.disabled = pending;
  dismiss.disabled = pending || snapshot?.status !== "open" || !!snapshot?.activeAction;

  const changed = value.revision !== revision;

  document.documentElement.dataset.theme = value.theme;
  if (changed) {
    revision = value.revision;
    selected.clear();
    list.replaceChildren();
    for (const finding of value.data.findings) {
      const item = document.createElement("li");
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "checkbox";
      input.value = finding.line + ":" + finding.code;
      input.addEventListener("change", () => {
        if (input.checked) selected.add(input.value); else selected.delete(input.value);

    }
    preview.value = value.data.text;
    status.textContent = value.readOnly ? "当前结果只能查看。" :
      value.data.findings.length ? "发现 " + value.data.findings.length + " 个问题" +
        (value.data.truncated ? "（仅列出前 100 个）。" : "。") : "没有发现格式问题。";

  else if (value.lastAction?.receipt.status === "completed") status.textContent = "修复预览已生成，没有修改文件。";

initialize();

})();</script>
</body>
</html>
