<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文本格式检查</title>
  <style>
    /* Inline this optional stylesheet into the plugin's standalone HTML at build time. */
:root {
  --ohs-background: var(--color-background-primary, Canvas);
  --ohs-foreground: var(--color-text-primary, CanvasText);
  --ohs-muted-foreground: var(--color-text-secondary, GrayText);
  --ohs-border: var(--color-border-primary, GrayText);
  --ohs-primary: var(--color-background-inverse, ButtonText);
  --ohs-primary-foreground: var(--color-text-inverse, ButtonFace);
  --ohs-accent: var(--color-background-secondary, ButtonFace);
  --ohs-destructive: var(--color-text-danger, CanvasText);
  --ohs-font-family: var(--font-sans, system-ui);
  --ohs-font-size: var(--font-text-md-size, 14px);
  --ohs-color-scheme: light;
  --ohs-motion-duration: 150ms;

  font-family: var(--ohs-font-family), system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: var(--ohs-font-size);
  color: var(--ohs-foreground);
  background: var(--ohs-background);
  color-scheme: var(--ohs-color-scheme);
  line-height: 1.5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
}

h1,
h2,
h3,
p {
  margin: 0 0 12px;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button,
input,
select,
textarea {
  border: 1px solid var(--ohs-border);
  border-radius: 8px;
  background: var(--ohs-background);
  padding: 8px 12px;
  transition: background-color var(--ohs-motion-duration), border-color var(--ohs-motion-duration);
}

button {
  cursor: pointer;
  background: var(--ohs-primary);
  color: var(--ohs-primary-foreground);
}

button:hover {
  background: var(--ohs-accent);
  color: var(--ohs-foreground);
}

button:disabled {
  cursor: default;
  opacity: .6;
}

:focus-visible {
  outline: 2px solid var(--ohs-primary);
  outline-offset: 2px;
}

small {
  color: var(--ohs-muted-foreground);
}

hr {
  border: 0;
  border-top: 1px solid var(--ohs-border);
  margin: 16px 0;
}

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
:root[data-theme="dark"] { --ohs-color-scheme: dark; }
@media (prefers-reduced-motion: reduce) { :root { --ohs-motion-duration: 0ms; } }

    [hidden] { display:none !important; }
    h1 { font-size:1.15rem; }
    .muted { color:var(--ohs-muted-foreground); }
    #findings { margin:0 0 16px; padding:0; list-style:none; max-height:190px; overflow:auto; border-block:1px solid var(--ohs-border); }
    #findings label { display:flex; align-items:center; gap:8px; min-height:38px; padding:6px 0; cursor:pointer; }
    input { accent-color:var(--ohs-primary); }
    .actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    button { border-radius:999px; }
    #selection-count { font-size:.85rem; }
    textarea { width:100%; min-height:80px; resize:vertical; margin-bottom:12px; }
    #preview { min-height:120px; max-height:250px; font-family:ui-monospace,monospace; tab-size:2; }
    label { display:block; margin-bottom:6px; }
    #status { min-height:21px; }
    footer { margin-top:16px; padding-top:12px; border-top:1px solid var(--ohs-border); }
    .danger { color:var(--ohs-destructive); background:transparent; }
  </style>
</head>
<body>
  <h1>文本格式检查</h1>
  <p class="muted">勾选要修复的问题，确认后生成文本预览。不会修改文件。</p>
  <button id="check-button" disabled>检查文本</button>
  <ul id="findings" aria-label="可选格式问题"></ul>
  <div class="actions"><button id="preview-button" disabled>生成修复预览</button><span id="selection-count" class="muted">请选择要修复的问题</span></div>
  <p id="status" role="status" aria-live="polite">粘贴文本后点击检查；也可从工具结果打开。</p>
  <label for="preview">待检查文本／当前预览</label>
  <textarea id="preview" spellcheck="false" aria-describedby="status"></textarea>
  <label for="conversation-text">给助手的说明（只携带勾选问题所在行）</label>
  <textarea id="conversation-text" maxlength="4096">请解释所选格式问题并给出建议。</textarea>
  <div class="actions"><button id="draft" hidden disabled>加入上下文</button><button id="submit" hidden disabled>交给助手</button></div>
