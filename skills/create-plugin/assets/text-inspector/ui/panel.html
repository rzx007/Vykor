<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文本格式检查</title>
  <style>
    /* Inline this optional stylesheet into the plugin's standalone HTML at build time. */
:root {
  --ohs-background: var(--color-background-primary, Canvas);
  --ohs-foreground: var(--color-text-primary, CanvasText);
  --ohs-muted-foreground: var(--color-text-secondary, GrayText);
  --ohs-border: var(--color-border-primary, GrayText);
  --ohs-primary: var(--color-background-inverse, ButtonText);
  --ohs-primary-foreground: var(--color-text-inverse, ButtonFace);
  --ohs-accent: var(--color-background-secondary, ButtonFace);
  --ohs-destructive: var(--color-text-danger, CanvasText);
  --ohs-font-family: var(--font-sans, system-ui);
  --ohs-font-size: var(--font-text-md-size, 14px);
  --ohs-color-scheme: light;
  --ohs-motion-duration: 150ms;

  font-family: var(--ohs-font-family), system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: var(--ohs-font-size);
  color: var(--ohs-foreground);
  background: var(--ohs-background);
  color-scheme: var(--ohs-color-scheme);
  line-height: 1.5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
}

[hidden] { display: none !important; }
h1 { font-size: 20px; font-weight: 600; }
label { display: block; margin-bottom: 6px; }
.muted, #status { color: var(--ohs-muted-foreground); font-size: 13px; }
.actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-block: 10px 12px; }
textarea { display: block; width: 100%; min-height: 80px; resize: vertical; line-height: 1.6; }
#preview { min-height: 200px; tab-size: 2; }
#findings { margin: 0 0 12px; padding: 0; list-style: none; max-height: 220px; overflow: auto; }
#findings li { border-bottom: 1px solid var(--ohs-border); }
#findings label { display: flex; align-items: start; gap: 8px; margin: 0; min-height: 40px; padding: 8px 0; cursor: pointer; }
#findings input { margin-top: 4px; accent-color: var(--ohs-primary); }
#selection-count { font-size: 12px; }
#empty-state { font-size: 13px; }
#status { min-height: 21px; overflow-wrap: anywhere; }
summary { width: fit-content; cursor: pointer; color: var(--ohs-muted-foreground); font-size: 13px; padding-block: 6px; }
details p { margin-block: 6px 10px; }
footer { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--ohs-border); }

h1,
h2,
h3,
p {
  margin: 0 0 12px;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button,
input,
select,
textarea {
  border: 1px solid var(--ohs-border);
  border-radius: 8px;
  background: var(--ohs-background);
  padding: 8px 12px;
  transition: background-color var(--ohs-motion-duration), border-color var(--ohs-motion-duration);
}

button {
  cursor: pointer;
  border-radius: 999px;
  background: transparent;
  color: var(--ohs-foreground);
  min-height: 32px;
}

button.primary {
  background: var(--ohs-primary);
  color: var(--ohs-primary-foreground);
}

button:hover:not(:disabled) {
  background: var(--ohs-accent);
  color: var(--ohs-foreground);
}

button:disabled {
  cursor: default;
  opacity: .6;
}

:focus-visible {
  outline: 2px solid var(--ohs-primary);
  outline-offset: 2px;
}

small {
  color: var(--ohs-muted-foreground);
}

hr {
  border: 0;
  border-top: 1px solid var(--ohs-border);
  margin: 16px 0;
}

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
:root[data-theme="dark"] { --ohs-color-scheme: dark; }
@media (prefers-reduced-motion: reduce) { :root { --ohs-motion-duration: 0ms; } }

  </style>
</head>
<body>
  <h1>文本格式检查</h1>
  <p class="muted">编辑文本，检查后勾选问题，生成修复预览。不会修改文件。</p>
  <label id="text-state" for="preview">待检查文本</label>
  <textarea id="preview" spellcheck="false" aria-describedby="status" placeholder="在这里粘贴待检查的文本"></textarea>
  <div class="actions"><button id="check-button" class="primary" disabled>检查文本</button></div>
  <p id="status" role="status" aria-live="polite">粘贴文本后点击检查；也可从工具结果打开。</p>
  <div id="incoming-result" hidden><p class="muted">新的检查结果已准备好；查看会替换上方正在编辑的文本。</p><button id="apply-result">替换当前文本，查看新结果</button></div>
  <section id="results" aria-label="检查结果" hidden>
    <p id="empty-state" hidden>没有发现行首制表符或行尾空白，可以继续编辑或在聊天中讨论。</p>
    <ul id="findings" aria-label="可选格式问题"></ul>
    <div class="actions"><button id="preview-button" disabled>生成修复预览</button><span id="selection-count" class="muted">请选择要修复的问题</span></div>
  </section>
  <details id="rules"><summary>检查哪些规则</summary><p class="muted">行首制表符：每个替换为 2 个空格。行尾空白：删除行尾空格和制表符。只修复勾选项，预览显示在上方文本框中。</p></details>
  <footer>
    <label for="conversation-text">与助手协作</label>
    <p class="muted">引用只携带勾选问题所在行；你可以在聊天中继续说明。</p>
    <textarea id="conversation-text" maxlength="4096" aria-label="引用到聊天的说明">请解释所选格式问题并给出建议。</textarea>
    <div class="actions"><button id="draft" hidden disabled>引用到聊天</button></div>
    <details id="more-collaboration"><summary>更多协作操作</summary><p class="muted">直接发送会立即将说明和勾选的问题交给助手。</p><button id="submit" hidden disabled>直接发送给助手</button></details>
  </footer>
