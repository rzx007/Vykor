<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文本格式检查</title>
  <style>
    /* UI_STYLES */
  </style>
</head>
<body>
  <h1>文本格式检查</h1>
  <p class="muted">编辑文本，检查后勾选问题，生成修复预览。不会修改文件。</p>
  <label id="text-state" for="preview">待检查文本</label>
  <textarea id="preview" spellcheck="false" aria-describedby="status" placeholder="在这里粘贴待检查的文本"></textarea>
  <div class="actions"><button id="check-button" class="primary" disabled>检查文本</button></div>
  <p id="status" role="status" aria-live="polite">粘贴文本后点击检查；也可从工具结果打开。</p>
  <div id="incoming-result" hidden><p class="muted">新的检查结果已准备好；查看会替换上方正在编辑的文本。</p><button id="apply-result">替换当前文本，查看新结果</button></div>
  <section id="results" aria-label="检查结果" hidden>
    <p id="empty-state" hidden>没有发现行首制表符或行尾空白，可以继续编辑或在聊天中讨论。</p>
    <ul id="findings" aria-label="可选格式问题"></ul>
    <div class="actions"><button id="preview-button" disabled>生成修复预览</button><span id="selection-count" class="muted">请选择要修复的问题</span></div>
  </section>
  <details id="rules"><summary>检查哪些规则</summary><p class="muted">行首制表符：每个替换为 2 个空格。行尾空白：删除行尾空格和制表符。只修复勾选项，预览显示在上方文本框中。</p></details>
  <footer>
    <label for="conversation-text">与助手协作</label>
    <p class="muted">引用只携带勾选问题所在行；你可以在聊天中继续说明。</p>
    <textarea id="conversation-text" maxlength="4096" aria-label="引用到聊天的说明">请解释所选格式问题并给出建议。</textarea>
    <div class="actions"><button id="draft" hidden disabled>引用到聊天</button></div>
    <details id="more-collaboration"><summary>更多协作操作</summary><p class="muted">直接发送会立即将说明和勾选的问题交给助手。</p><button id="submit" hidden disabled>直接发送给助手</button></details>
  </footer>
  <!-- UI_SCRIPT -->
</body>
</html>
