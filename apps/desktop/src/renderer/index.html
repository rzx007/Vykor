<!doctype html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vykor</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' vykor-plugin-app: vykor-preview:"
    />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      :root {
        --startup-foreground: #95a7bb;
        --startup-tint: #7899c3;
      }

      :root.dark {
        --startup-foreground: #b3c0cf;
        --startup-tint: #91b6e4;
      }

      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          --startup-foreground: #b3c0cf;
          --startup-tint: #91b6e4;
        }
      }

      /* 保留原生窗口材质；轮廓与光雾直接叠在背景上，不再放进独立徽标。 */
      #startup-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        -webkit-app-region: drag;
        color: color-mix(
          in oklab,
          var(--startup-foreground) 90%,
          var(--primary, var(--startup-tint))
        );
        user-select: none;
        transition: opacity 0.16s ease;
      }

      #startup-loading[data-startup-dismissed="true"] {
        opacity: 0;
        pointer-events: none;
      }

      .startup-loading-content {
        width: min(26rem, 80vw);
        animation: startup-wordmark-in 0.24s ease-out both;
      }

      .startup-loading-wordmark {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .startup-loading-wordmark use {
        fill: none;
        stroke: currentColor;
        stroke-linejoin: round;
      }

      .startup-loading-outline {
        stroke-width: 0.4;
        opacity: 0.45;
      }

      /* 模糊只作用于轮廓副本，主体始终清楚；越向外越淡。 */
      .startup-loading-haze-near {
        stroke-width: 0.7;
        filter: blur(2.5px);
        opacity: 0.08;
      }

      .startup-loading-haze-mid {
        stroke-width: 0.9;
        filter: blur(7px);
        opacity: 0.04;
      }

      .startup-loading-haze-far {
        stroke-width: 1.2;
        filter: blur(16px);
        opacity: 0.02;
      }

      .startup-loading-light-outline {
        stroke-width: 0.4;
        opacity: 0.95;
      }

      /* 参考 beUI TextShimmer 的连续扫光，用 SVG 遮罩只照亮镂空轮廓。 */
      .startup-loading-sweep {
        animation: startup-wordmark-sweep 3s linear -0.7s infinite;
      }

      @keyframes startup-wordmark-in {
        from {
          opacity: 0.4;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes startup-wordmark-sweep {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(520px);
        }
      }

      :root[data-reduced-motion="true"] .startup-loading-content,
      :root[data-reduced-motion="true"] .startup-loading-sweep {
        animation: none;
      }

      :root[data-reduced-motion="true"] .startup-loading-light {
        display: none;
      }

      :root[data-reduced-motion="true"] .startup-loading-outline {
        opacity: 0.7;
      }

      :root[data-reduced-motion="true"] #startup-loading {
        transition: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-loading-content,
        .startup-loading-sweep {
          animation: none;
        }
        .startup-loading-light {
          display: none;
        }
        .startup-loading-outline {
          opacity: 0.7;
        }
        #startup-loading {
          transition: none;
        }
      }

      @media (forced-colors: active) {
        .startup-loading-wordmark use {
          stroke: CanvasText;
        }
        .startup-loading-outline {
          opacity: 1;
        }
        .startup-loading-haze-near,
        .startup-loading-haze-mid,
        .startup-loading-haze-far,
        .startup-loading-light {
          display: none;
        }
      }
    </style>
    <script type="module" src="./src/startup-theme.ts"></script>
  </head>

  <body>
    <div id="root"></div>

            />
            <linearGradient id="startup-light-gradient">
              <stop offset="0" stop-color="white" stop-opacity="0" />
              <stop offset="0.3" stop-color="white" stop-opacity="0.15" />
              <stop offset="0.45" stop-color="white" />
              <stop offset="0.55" stop-color="white" />
              <stop offset="0.7" stop-color="white" stop-opacity="0.15" />
              <stop offset="1" stop-color="white" stop-opacity="0" />
            </linearGradient>
            <mask
              id="startup-light-mask"
              maskUnits="userSpaceOnUse"
              x="-64"
              y="-64"
              width="448"
              height="256"
              style="mask-type: alpha"
            >
              <rect
                class="startup-loading-sweep"
                x="-200"
                y="-32"
                width="200"
                height="192"
                fill="url(#startup-light-gradient)"
              />
            </mask>
          </defs>
          <use class="startup-loading-haze-far" href="#startup-wordmark" />
          <use class="startup-loading-haze-mid" href="#startup-wordmark" />
          <use class="startup-loading-haze-near" href="#startup-wordmark" />
          <use class="startup-loading-outline" href="#startup-wordmark" />
          <g class="startup-loading-light" mask="url(#startup-light-mask)">
            <use class="startup-loading-light-outline" href="#startup-wordmark" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
