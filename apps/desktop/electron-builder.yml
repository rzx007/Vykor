appId: app.vykor.desktop
productName: Vykor
directories:
  buildResources: resources
# 只带编译产物。node_modules 由 electron-builder 按 production dependencies 另收，
# 不要用默认 **/*，否则会扫整个 apps/desktop（含源码和构建工具）。
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
  - node_modules/@arcships/light-ocr/**
  - node_modules/@arcships/light-ocr-model-*/**
  - node_modules/better-sqlite3/prebuilds/**
  - node_modules/node-pty/build/**
  - node_modules/node-pty/prebuilds/**
  - node_modules/@arcships/light-ocr-runtime/**
  - node_modules/@arcships/light-ocr-win32-*/**
  - node_modules/@arcships/light-ocr-linux-*/**
  - node_modules/@arcships/light-ocr-darwin-*/**
  - node_modules/@img/**
  - node_modules/sharp/**
win:
  executableName: Vykor
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: Vykor
  maintainer: Vykor
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: rzx007
  repo: openharness-ts
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
