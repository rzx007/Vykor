<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>协作笔记</title><style>:root {
  --ohs-background: var(--color-background-primary, Canvas);
  --ohs-foreground: var(--color-text-primary, CanvasText);
  --ohs-muted-foreground: var(--color-text-secondary, GrayText);
  --ohs-border: var(--color-border-primary, GrayText);
  --ohs-primary: var(--color-background-inverse, ButtonText);
  --ohs-primary-foreground: var(--color-text-inverse, ButtonFace);
  --ohs-accent: var(--color-background-secondary, ButtonFace);
  --ohs-destructive: var(--color-text-danger, CanvasText);
  font-family: var(--font-sans, system-ui), "Segoe UI", sans-serif;
  font-size: var(--font-text-md-size, 14px);
  color: var(--ohs-foreground);
  background: var(--ohs-background);
  line-height: 1.5;
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; padding: 16px; }
header, .editor-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header { margin-bottom: 8px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
p { margin: 0 0 12px; }
.muted, #status, #revision, #save-state { color: var(--ohs-muted-foreground); font-size: 12px; }
.editor-heading { margin: 16px 0 6px; }
textarea { width: 100%; display: block; min-height: 280px; font: inherit; line-height: 1.65; padding: 12px; border: 1px solid var(--ohs-border); border-radius: 8px; background: inherit; color: inherit; resize: vertical; }
button { font: inherit; min-height: 32px; border: 1px solid var(--ohs-border); border-radius: 999px; padding: 6px 12px; background: transparent; color: inherit; cursor: pointer; transition: background-color 150ms; }
button.primary { background: var(--ohs-primary); color: var(--ohs-primary-foreground); }
button.danger { color: var(--ohs-destructive); }
button:hover:not(:disabled) { background: var(--ohs-accent); color: var(--ohs-foreground); }
button:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 2px solid var(--ohs-primary); outline-offset: 2px; }
.actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-block: 12px; }
#status { min-height: 18px; overflow-wrap: anywhere; }
#conflict { margin-block: 16px; padding-block: 12px; border-block: 1px solid var(--ohs-border); }
summary { cursor: pointer; width: fit-content; padding-block: 6px; }
pre { max-height: 240px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; line-height: 1.65; }
footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--ohs-border); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style></head>
<body>
  <header><h1>协作笔记</h1><span id="revision"></span></header>
  <p class="muted">在这里编辑正文，完成后手工保存。</p>
  <div class="editor-heading"><label for="draft">笔记正文</label><span id="save-state" role="status" aria-live="polite">正在读取…</span></div>
  <textarea id="draft" rows="14" aria-describedby="status" disabled></textarea>
  <div class="actions"><button id="save" class="primary" disabled>保存草稿</button><button id="selection" hidden disabled>引用选区到聊天</button></div>
  <p id="status" role="status" aria-live="polite">正在连接…</p>
  <section id="conflict" hidden aria-label="远端更新">
    <h2>远端笔记有更新</h2>
    <p class="muted">本地草稿已保留。先查看新版本，再手工合并或选择采用新版。</p>
    <details id="remote-details"><summary id="remote-version">查看远端新版</summary><pre id="remote"></pre></details>
    <div class="actions"><button id="merge">我已手工合并，继续编辑</button><button id="adopt">采用远端新版</button></div>
    <div id="adopt-confirmation" hidden>
      <p>采用新版会替换当前本地草稿，无法恢复本地未保存的修改。</p>
      <div class="actions"><button id="confirm-adopt" class="danger">确认采用新版</button><button id="cancel-adopt">保留本地草稿</button></div>
    </div>
  </section>
  <footer><button id="refresh">读取最新笔记</button><span class="muted">有未保存修改时，读取新版本会保留本地草稿。</span></footer>
