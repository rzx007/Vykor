<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文本格式检查</title>
  <style>
    :root { color-scheme: light; --bg:#fff; --fg:#202124; --muted:#62666c; --line:#dedfe2; --control:#f5f5f6; --focus:#3265bf; }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#18191b; --fg:#ececef; --muted:#b0b3b9; --line:#3c3e43; --control:#25272b; --focus:#8bb3fb; }
    * { box-sizing:border-box; }
    body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,sans-serif; }
    h1 { margin:0 0 4px; font-size:16px; font-weight:600; }
    p { margin:0 0 12px; }
    .muted { color:var(--muted); }
    #findings { margin:0 0 16px; padding:0; list-style:none; max-height:190px; overflow:auto; border-block:1px solid var(--line); }
    #findings label { display:flex; align-items:center; gap:8px; min-height:38px; padding:6px 0; cursor:pointer; }
    input { accent-color:var(--focus); }
    button { min-height:34px; padding:6px 10px; border:1px solid var(--line); border-radius:5px; background:var(--control); color:var(--fg); font:inherit; cursor:pointer; }
    button:disabled { opacity:.55; cursor:default; }
    :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    #preview { width:100%; min-height:120px; max-height:250px; resize:vertical; padding:10px; border:1px solid var(--line); border-radius:5px; color:var(--fg); background:var(--bg); font:13px/1.5 ui-monospace,monospace; tab-size:2; }
    .preview-label { display:block; margin-bottom:6px; }
    #status { min-height:21px; margin-bottom:8px; }
    footer { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    @media (max-width:360px) { body { padding:12px; } .actions button { flex:1 1 auto; } }
  </style>
</head>
<body>
  <h1>文本格式检查</h1>
  <p class="muted">勾选要修复的问题，确认后生成文本预览。不会修改文件。</p>
  <ul id="findings" aria-label="可选格式问题"></ul>
  <div class="actions"><button id="preview-button" disabled>生成修复预览</button></div>
  <p id="status" role="status" aria-live="polite">正在加载检查结果…</p>
  <label class="preview-label" for="preview">当前文本（可选中复制）</label>
  <textarea id="preview" readonly spellcheck="false" aria-describedby="status"></textarea>
  <footer><button id="sidebar">在侧栏查看</button><button id="dismiss">结束此交互</button></footer>
  <!-- UI_SCRIPT -->
</body>
</html>
