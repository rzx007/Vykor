<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文本格式检查</title>
  <style>
    /* Inline this optional stylesheet into the plugin's standalone HTML at build time. */
:root {
  font-family: var(--ohs-font-family), system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: var(--ohs-font-size);
  color: var(--ohs-foreground);
  background: var(--ohs-background);
  color-scheme: var(--ohs-color-scheme);
  line-height: 1.5;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; }
h1, h2, h3, p { margin: 0 0 12px; }
button, input, select, textarea { font: inherit; color: inherit; }
button, input, select, textarea {
  border: 1px solid var(--ohs-border);
  border-radius: 8px;
  background: var(--ohs-background);
  padding: 8px 12px;
  transition: background-color var(--ohs-motion-duration), border-color var(--ohs-motion-duration);
}
button { cursor: pointer; background: var(--ohs-primary); color: var(--ohs-primary-foreground); }
button:hover { background: var(--ohs-accent); color: var(--ohs-foreground); }
button:disabled { cursor: default; opacity: .6; }
:focus-visible { outline: 2px solid var(--ohs-primary); outline-offset: 2px; }
small { color: var(--ohs-muted-foreground); }
hr { border: 0; border-top: 1px solid var(--ohs-border); margin: 16px 0; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

    [hidden] { display:none !important; }
    h1 { font-size:1.15rem; }
    .muted { color:var(--ohs-muted-foreground); }
    #findings { margin:0 0 16px; padding:0; list-style:none; max-height:190px; overflow:auto; border-block:1px solid var(--ohs-border); }
    #findings label { display:flex; align-items:center; gap:8px; min-height:38px; padding:6px 0; cursor:pointer; }
    input { accent-color:var(--ohs-primary); }
    .actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    button { border-radius:999px; }
    #selection-count { font-size:.85rem; }
    textarea { width:100%; min-height:80px; resize:vertical; margin-bottom:12px; }
    #preview { min-height:120px; max-height:250px; font-family:ui-monospace,monospace; tab-size:2; }
    label { display:block; margin-bottom:6px; }
    #status { min-height:21px; }
    footer { margin-top:16px; padding-top:12px; border-top:1px solid var(--ohs-border); }
    .danger { color:var(--ohs-destructive); background:transparent; }
  </style>
</head>
<body>
  <h1>文本格式检查</h1>
  <p class="muted">勾选要修复的问题，确认后生成文本预览。不会修改文件。</p>
  <ul id="findings" aria-label="可选格式问题"></ul>
  <div class="actions"><button id="preview-button" disabled>生成修复预览</button><span id="selection-count" class="muted">请选择要修复的问题</span></div>
  <p id="status" role="status" aria-live="polite">正在加载检查结果…</p>
  <label for="preview">当前文本（可选中复制）</label>
  <textarea id="preview" readonly spellcheck="false" aria-describedby="status"></textarea>
  <label for="conversation-text">给助手的说明（只携带勾选问题所在行）</label>
  <textarea id="conversation-text" maxlength="4096">请解释所选格式问题并给出建议。</textarea>
  <div class="actions"><button id="draft" hidden disabled>加入输入框</button><button id="submit" hidden disabled>交给助手</button></div>
  <footer><button id="dismiss" class="danger" aria-describedby="finish-hint">结束此交互</button><small id="finish-hint">结束后仅供查看</small></footer>

    input.disabled = pending || (locked && !snapshot?.capabilities.draft && !snapshot?.capabilities.submit);

      const item = document.createElement("li");
      const label = document.createElement("label");

  else if (value.activeAction) status.textContent = "正在生成修复预览…";
  else if (value.readOnly) status.textContent = "当前结果只能查看。";
  else if (value.lastAction?.executionState === "unknown") status.textContent = "无法确认上次操作结果，请查看会话记录；不会自动重试。";

function conversationPayload(mode) {
  const text = note.value.trim();
  if (!text || [...text].length > 4096) throw new Error("说明需要 1–4096 个字符；没有发送内容。");
  const lines = snapshot.data.text.split("\n");
  const data = { findings: snapshot.data.findings.filter(item => selected.has(item.line + ":" + item.code))
    .map(item => ({ line: item.line, code: item.code, text: lines[item.line - 1] })) };
  if (new TextEncoder().encode(JSON.stringify(data)).byteLength > 32 * 1024)
    throw Object.assign(new Error("Selected data exceeds the conversation limit"), { code: "plugin_ui_payload_too_large" });
  return { mode, expectedRevision: snapshot.revision, text, data };
}
async function initialize() {
  try {
    const client = await createPluginUiClient();
    render(await client.getSnapshot());
    client.onSnapshot(render);
    note.addEventListener("input", controls);
    button.addEventListener("click", async () => {
      if (button.disabled) return;
      pending = true; controls(); status.textContent = "等待你在主界面确认…";
      try {
        const receipt = await client.requestAction("preview", { text: snapshot.data.text, selected: [...selected] });
        if (snapshot.lastAction?.receipt.requestId === receipt.requestId) render(snapshot);
        else status.textContent = "操作已受理，正在等待结果更新…";
      } catch (error) { report(error); }
      finally { pending = false; controls(); }
    });
    for (const [element, mode] of [[draft, "draft"], [submit, "submit"]]) {
      element.addEventListener("click", async () => {
        if (element.disabled) return;
        try {
          const payload = conversationPayload(mode);
          pending = true; controls();
          status.textContent = mode === "submit" ? "等待你在主界面确认交给助手…" : "正在加入输入框…";
          const receipt = await client.requestConversation(payload);
          status.textContent = receipt.mode === "draft" ? "已加入输入框，尚未发送。" : "已交给助手，请查看会话回执。";
        } catch (error) { report(error); }
        finally { pending = false; controls(); }
      });
    }
    dismiss.addEventListener("click", () => { client.dismiss().catch(report); });
    window.addEventListener("pagehide", () => client.dispose(), { once: true });
  } catch (error) {
    draft.disabled = true; submit.disabled = true; dismiss.disabled = true; report(error);
  }
}
initialize();

})();</script>
