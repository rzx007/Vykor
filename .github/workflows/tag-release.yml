name: Tag Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable release version (X.Y.Z)"
        required: true
        type: string

concurrency:
  group: tag-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin commit and validate tag
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
          REQUESTED_SHA: ${{ github.sha }}
        run: |
          TAG="v${VERSION}"
          TAG="$TAG" node --input-type=module -e "import { parseReleaseTag } from './scripts/prepare-tag-release.mjs'; parseReleaseTag(process.env.TAG)"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          REQUESTED_SHA="$REQUESTED_SHA" CHECKED_OUT_SHA="$CHECKED_OUT_SHA" node --input-type=module -e "import { assertReleaseCommit } from './scripts/release-safety.mjs'; assertReleaseCommit({ requestedSha: process.env.REQUESTED_SHA, checkedOutSha: process.env.CHECKED_OUT_SHA })"
          REMOTE_COMMIT="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | cut -f1)"
          if [ -z "$REMOTE_COMMIT" ]; then
            REMOTE_COMMIT="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)"
          fi
          TAG="$TAG" TARGET_SHA="$CHECKED_OUT_SHA" EXISTING_SHA="$REMOTE_COMMIT" node --input-type=module -e "import { assertTagAvailable } from './scripts/release-safety.mjs'; assertTagAvailable({ tag: process.env.TAG, targetSha: process.env.TARGET_SHA, existingSha: process.env.EXISTING_SHA })"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$CHECKED_OUT_SHA" >> "$GITHUB_OUTPUT"

  preflight:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync candidate versions
        run: node scripts/prepare-tag-release.mjs ${{ needs.validate.outputs.tag }}
      - name: Run release checks before creating a tag
        run: |
          pnpm check-types
          pnpm test
          pnpm check:architecture
          pnpm check-docs
          pnpm test:scripts
      - name: Generate stable release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          node scripts/release-assets.mjs write-notes release-notes.md
      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: stable-release-notes
          path: release-notes.md
          if-no-files-found: error

  build-desktop:
    needs: [validate, preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - name: Setup Visual Studio Build Tools (Windows)
        if: matrix.target == 'win'
        uses: microsoft/setup-msbuild@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync workspace versions to the tag
        run: node scripts/prepare-tag-release.mjs ${{ needs.validate.outputs.tag }}
      - name: Build and verify Desktop
        run: |
          pnpm --filter @openharness/desktop verify:update-packaging
          pnpm --filter @openharness/desktop^... build
          pnpm --filter @openharness/desktop build
      - name: Package Windows
        if: matrix.target == 'win'
        run: pnpm --filter @openharness/desktop exec -- electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Package Linux
        if: matrix.target == 'linux'
        run: pnpm --filter @openharness/desktop exec -- electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify updater artifacts
        run: pnpm --filter @openharness/desktop verify:update-packaging:artifact
      - name: Record migrations from the packaged Desktop app
        run: pnpm --filter @openharness/desktop exec node scripts/verify-migration-artifact.mjs --write-inventory ${{ matrix.target }}
      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.AppImage.blockmap
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest.yml
            apps/desktop/dist/latest-linux.yml
            apps/desktop/dist/clean-slate-migrations-*.json
          if-no-files-found: error

  verify-clean-slate-artifacts:
    needs: [validate, preflight, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - name: Download and merge Windows and Linux Desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Verify both Desktop artifact sets are present
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          find release-assets -maxdepth 1 -type f -printf '%f\n' > artifact-names.txt
          node scripts/release-assets.mjs assert-artifacts artifact-names.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Windows and Linux packaged migration inventories
        run: >-
          pnpm --filter @openharness/desktop exec node scripts/verify-migration-artifact.mjs
          --verify-inventories
          release-assets/clean-slate-migrations-win.json
          release-assets/clean-slate-migrations-linux.json
      - name: Sync workspace versions to the tag
        run: node scripts/prepare-tag-release.mjs ${{ needs.validate.outputs.tag }}
      - name: Build CLI and Desktop migration inventories together
        run: |
          pnpm --filter @rzx/ohs... build
          pnpm --filter @openharness/desktop^... build
          pnpm --filter @openharness/desktop build
      - name: Require clean-slate bundle inventories before tagging
        run: pnpm check:clean-slate:artifacts

  create-tag:
    needs: [validate, preflight, build-desktop, verify-clean-slate-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - name: Create tag only after checks and packaging pass
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          REMOTE_COMMIT="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | cut -f1)"
          if [ -z "$REMOTE_COMMIT" ]; then
            REMOTE_COMMIT="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)"
          fi
          ACTION="$(TAG="$TAG" TARGET_SHA="$COMMIT" EXISTING_SHA="$REMOTE_COMMIT" node --input-type=module -e "import { assertTagAvailable } from './scripts/release-safety.mjs'; process.stdout.write(assertTagAvailable({ tag:process.env.TAG, targetSha:process.env.TARGET_SHA, existingSha:process.env.EXISTING_SHA }))")"
          if [ "$ACTION" = "create" ]; then
            git tag "$TAG" "$COMMIT"
            git push origin "$TAG"
          fi

  publish-npm:
    needs: [validate, create-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build, publish idempotently, and verify npm
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node scripts/prepare-tag-release.mjs "v${VERSION}"
          pnpm --filter @rzx/ohs... build
          PUBLISHED_VERSION="$(npm view "@rzx/ohs@${VERSION}" version 2>/dev/null || true)"
          ACTION="$(EXPECTED_VERSION="$VERSION" PUBLISHED_VERSION="$PUBLISHED_VERSION" node --input-type=module -e "import { decideNpmPublish } from './scripts/release-safety.mjs'; process.stdout.write(decideNpmPublish({ expectedVersion:process.env.EXPECTED_VERSION, publishedVersion:process.env.PUBLISHED_VERSION }))")"
          if [ "$ACTION" = "publish" ]; then
            pnpm --filter @rzx/ohs publish --access public --no-git-checks
          fi
          ACTUAL="$(npm view "@rzx/ohs@${VERSION}" version)"
          test "$ACTUAL" = "$VERSION"

  publish-release:
    needs: [validate, create-tag, publish-npm, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - name: Download Desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: stable-release-notes
          path: release-assets
      - name: Validate, create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          test -f release-assets/release-notes.md
          find release-assets -maxdepth 1 -type f -printf '%f\n' > artifact-names.txt
          node scripts/release-assets.mjs assert-artifacts artifact-names.txt
          cp release-assets/release-notes.md release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --latest --title "OpenHarness ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$TAG" release-assets/* --verify-tag --latest --title "OpenHarness ${VERSION}" --notes-file release-notes.md
          fi

  finalize:
    needs: [validate, publish-npm, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: stable-release-notes
      - name: Read back npm, notes and artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          ACTUAL="$(npm view "@rzx/ohs@${VERSION}" version)"
          test "$ACTUAL" = "$VERSION"
          gh release view "$TAG" --json body --jq .body > published-release-notes.md
          diff -u release-notes.md published-release-notes.md
          gh release view "$TAG" --json assets --jq '.assets[].name' > published-artifacts.txt
          node scripts/release-assets.mjs assert-artifacts published-artifacts.txt
          printf 'Version: %s\nCommit: %s\nTag: %s\n' "$VERSION" "$COMMIT" "$TAG" >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [validate, preflight, build-desktop, verify-clean-slate-artifacts, create-tag, publish-npm, publish-release, finalize]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify by email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          secure: true
          from: OpenHarness Release <${{ secrets.SMTP_USER }}>
          to: ${{ secrets.NOTIFY_TO }}
          subject: "[Release] ${{ github.repository }} ${{ needs.finalize.result }} v${{ inputs.version }} (#${{ github.run_number }})"
          body: |
            Version: ${{ inputs.version }}
            preflight: ${{ needs.preflight.result }}
            build-desktop: ${{ needs.build-desktop.result }}
            verify-clean-slate-artifacts: ${{ needs.verify-clean-slate-artifacts.result }}
            create-tag: ${{ needs.create-tag.result }}
            publish-npm: ${{ needs.publish-npm.result }}
            publish-release: ${{ needs.publish-release.result }}
            finalize: ${{ needs.finalize.result }}
            Actor: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
