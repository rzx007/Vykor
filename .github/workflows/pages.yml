name: Deploy Vykor website

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/vykor-home/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: artifacts/vykor-home
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: artifacts/vykor-home/package-lock.json
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install website dependencies
        run: npm ci --workspaces=false
      - name: Check website
        run: npm run check
      - name: Build website
        run: npm run build -- --base "$PAGES_BASE_PATH/"
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/vykor-home/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
